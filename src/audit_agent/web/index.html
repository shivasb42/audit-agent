<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
    --accent: #2f6fed; --danger: #c93a3a; --ok: #2a8a55;
    --backend: #8a4b0f; --backend-bg: #fbefe3; --web: #1f5fbf; --web-bg: #e8f0fd; --mobile: #2a7a4b; --mobile-bg: #e6f4ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; height: 57px; }
  header h1 { font-size: 16px; margin: 0; }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tabs button { border-color: transparent; background: transparent; color: var(--muted); }
  .tabs button.active { background: #eef4ff; color: var(--accent); border-color: #cfdcfb; }
  .tabs button:disabled { opacity: .4; }
  select, input, button { font: inherit; }
  select, input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { border-color: #c7ccd6; }
  button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
  button.ok { color: #fff; background: var(--ok); border-color: var(--ok); }
  button:disabled { opacity: .45; cursor: default; }
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  nav { padding: 10px 0; position: sticky; top: 73px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
  .project { padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
  .project:last-child { border-bottom: 0; }
  .project-name { padding: 4px 14px; font-weight: 600; }
  .project-path { padding: 0 14px 4px; color: var(--muted); font-size: 12px; word-break: break-all; }
  .app { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; }
  .app:hover { background: #f8faff; }
  .app.active { background: #eef4ff; box-shadow: inset 3px 0 0 var(--accent); }
  .app .name { flex: 1; min-width: 0; word-break: break-all; }
  .app .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .api-link { display: block; margin: 4px 14px 0; padding: 4px 10px; font-size: 13px; }
  .api-link.active { border-color: var(--accent); color: var(--accent); }
  .type { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #eef1f6; color: var(--muted); white-space: nowrap; }
  .type.backend { background: var(--backend-bg); color: var(--backend); }
  .type.web { background: var(--web-bg); color: var(--web); }
  .type.mobile { background: var(--mobile-bg); color: var(--mobile); }
  .tasks-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .app-info { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .app-info h2 { font-size: 15px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
  .app-info ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .app-info li.supporting { color: var(--muted); }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chip { padding: 2px 10px; border-radius: 999px; background: #eef1f6; color: var(--muted); font-size: 12px; cursor: pointer; border: 1px solid transparent; }
  .chip.active { border-color: var(--accent); color: var(--accent); background: #eef4ff; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .filters input[type=text] { width: 190px; }
  .bulk { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); flex-wrap: wrap; }
  .bulk .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; position: sticky; top: 57px; z-index: 1; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #f8faff; }
  tr.row.selected td { background: #eef4ff; }
  tr.row.cancelled td { color: var(--muted); }
  tr.row.cancelled .title { text-decoration: line-through; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .reason { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eef1f6; }
  .badge.pending { background: #eef4ff; color: var(--accent); }
  .badge.cancelled, .badge.broken, .badge.wrong_method { background: #f9eaea; color: var(--danger); }
  .badge.done { background: #e8f5ee; color: var(--ok); }
  .badge.test { background: #f3eefc; color: #6b46c1; margin-left: 6px; }
  .badge.api { background: #e6f4f1; color: #0f6e5c; font-weight: 600; }
  .role { display: inline-block; min-width: 64px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  aside { padding: 14px 16px; position: sticky; top: 73px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside h3, .api h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  aside ul { margin: 0; padding-left: 18px; }
  aside li { margin: 2px 0; word-break: break-all; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .gaps { padding: 12px 14px; color: var(--muted); font-size: 13px; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .api { padding: 4px 16px 16px; }
  .api section { margin-top: 8px; }
  .api h2 { font-size: 16px; margin: 12px 0 2px; }
  .api h3 { display: flex; align-items: center; gap: 10px; }
  .api h3 input { text-transform: none; letter-spacing: 0; font-weight: 400; width: 260px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .link-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 240px; }
  .link-card .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .claude-bar { background: #fbfcff; }
  .claude-bar input[type=number] { width: 56px; padding: 4px 6px; }
  .run-detail { padding: 0 14px; font-size: 13px; }
  .run-detail:not(:empty) { padding: 8px 14px 10px; border-bottom: 1px solid var(--line); }
  .run-detail .item { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; cursor: pointer; }
  .run-detail .item:hover .t { text-decoration: underline; }
  .run-detail .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: var(--danger); font-size: 12px; }
  .badge.running, .badge.queued { background: #fff4dc; color: #8a5a00; }
  .badge.failed { background: #f9eaea; color: var(--danger); }
  .badge.waiting { background: #fff4dc; color: #8a5a00; }
  .badge.in_batch, .badge.in_progress, .badge.submitting, .badge.canceling, .badge.ended { background: #eef1fb; color: #3a4fa0; }
  .badge.imported { background: #e8f5ee; color: var(--ok); }
  .finding { border-left: 3px solid var(--danger); padding: 4px 0 6px 10px; margin: 8px 0; }
  .finding.review { border-left-color: #c79a2a; }
  .finding .meta { font-size: 12px; color: var(--muted); }
  .finding pre { margin: 4px 0; padding: 6px 8px; background: #f6f7f9; border-radius: 6px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .sev.critical, .sev.high { color: var(--danger); }
  .sev.medium { color: #8a5a00; }
  .sev.low { color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Audit review</h1>
  <span id="where" class="reason"></span>
  <div class="tabs">
    <button id="tab-tasks" class="active">Tasks</button>
    <button id="tab-api">API map</button>
  </div>
</header>
<div class="layout">
  <nav class="panel" id="sidebar"><div class="empty">Loading…</div></nav>
  <div id="content">
    <div id="tasks-view" class="tasks-grid">
      <section class="panel">
        <div class="app-info" id="app-info"></div>
        <div class="counts" id="counts"></div>
        <div class="filters">
          <select id="status"><option value="">Any status</option></select>
          <select id="kind">
            <option value="">All tasks</option>
            <option value="api">API calls only</option>
            <option value="files">File groups only</option>
          </select>
          <input id="folder" type="text" placeholder="Folder, e.g. scripts">
          <select id="tests">
            <option value="">Tests and app code</option>
            <option value="hide">Hide test code</option>
            <option value="only">Only test code</option>
          </select>
          <input id="search" type="text" placeholder="Search titles and files">
        </div>
        <div class="bulk">
          <span id="selection">0 selected</span>
          <button id="cancel-selected" disabled>Cancel selected</button>
          <button id="restore-selected" disabled>Restore selected</button>
          <span class="spacer"></span>
          <span id="matching"></span>
          <button id="cancel-matching" class="danger">Cancel all matching</button>
          <button id="restore-matching" class="ok">Restore all matching</button>
        </div>
        <div class="bulk claude-bar">
          <strong>Claude</strong>
          <button id="send-selected" class="primary" disabled>Send selected</button>
          <button id="send-matching" class="primary">Send all pending</button>
          <label>at a time <input id="parallel" type="number" min="1" max="8" value="2"></label>
          <span class="spacer"></span>
          <span id="run-summary"></span>
          <button id="run-stop" hidden title="Drop queued tasks; running ones finish">Stop queue</button>
        </div>
        <div class="run-detail" id="run-detail"></div>
        <div class="bulk claude-bar">
          <strong>Batch</strong>
          <span class="reason">half price, results within 24 hours; you can close the app meanwhile</span>
          <button id="batch-selected" disabled>Batch selected</button>
          <button id="batch-matching">Batch all pending</button>
          <span class="spacer"></span>
          <span id="batch-summary" class="reason"></span>
          <button id="batch-check" title="Ask Anthropic now instead of waiting for the next check">Check now</button>
          <button id="batch-recover" title="List the batches on your Anthropic account and import any this app lost track of">Recover lost batches</button>
        </div>
        <div class="run-detail" id="batch-detail"></div>
        <table>
          <thead><tr>
            <th><input type="checkbox" id="select-all" title="Select all shown"></th>
            <th class="num">Priority</th><th>Task</th><th>Status</th><th class="num">Files</th><th class="num">Lines</th><th></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="gaps" id="gaps"></div>
      </section>
      <aside class="panel" id="detail"><div class="empty">Select a task to see its files and connections.</div></aside>
    </div>
    <div id="api-view" class="panel api" hidden></div>
  </div>
</div>
<div id="toast"></div>
<script>
const STATUSES = ["pending", "running", "done", "failed", "blocked", "cancelled"];
const TYPE_LABELS = { backend: "Backend", web: "Web", mobile: "Mobile", unknown: "Unknown" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const typeBadge = (t) => `<span class="type ${esc(t)}">${TYPE_LABELS[t] || esc(t)}</span>`;
const RUNNABLE = ["pending", "failed", "blocked"];
const state = { groups: [], app: null, project: null, tab: "tasks", tasks: [], selected: new Set(), openTask: null, apiMap: null, run: null, batches: null };

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Audit-Agent": "1" },
    body: JSON.stringify(body),
  };
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const message = data.error || res.statusText;
    if (/^no route for \/api\//.test(message)) {
      throw new Error("The audit-agent ui server is older than this page. Stop it (Ctrl+C) and start it again.");
    }
    throw new Error(message);
  }
  return data;
}

function toast(text, isError = false) {
  const t = $("toast");
  t.textContent = text;
  t.style.background = isError ? "var(--danger)" : "";
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), isError ? 8000 : 2200);
}

window.addEventListener("unhandledrejection", (e) => toast(`Error: ${e.reason?.message || e.reason}`, true));

const appKey = (a) => `${a.audit_id}:${a.root ?? ""}`;
const taskTotal = (a) => Object.values(a.task_counts).reduce((x, y) => x + y, 0);

function filter() {
  return {
    status: $("status").value, folder: $("folder").value.trim(), tests: $("tests").value, search: $("search").value.trim(),
    app: state.app?.root ?? "", kind: $("kind").value,
  };
}

function writeHash() {
  const p = new URLSearchParams();
  if (state.tab === "api" && state.project?.id) { p.set("project", state.project.id); p.set("tab", "api"); }
  else if (state.app) p.set("app", appKey(state.app));
  history.replaceState(null, "", "#" + p);
}

function renderSidebar() {
  if (!state.groups.length) {
    $("sidebar").innerHTML = '<div class="empty">No audits yet. Run <code>audit-agent start &lt;folder&gt;</code>.</div>';
    return;
  }
  $("sidebar").innerHTML = state.groups.map((g, gi) => `
    <div class="project">
      <div class="project-name">${esc(g.name)}</div>
      ${g.root_path ? `<div class="project-path">${esc(g.root_path)}</div>` : ""}
      ${g.apps.map((a) => `
        <div class="app ${state.tab === "tasks" && state.app && appKey(state.app) === appKey(a) ? "active" : ""}"
             data-group="${gi}" data-key="${esc(appKey(a))}"
             title="${esc(a.evidence.map((e) => e.signal).join("\n") || "no backend, web, or mobile signals")}">
          ${typeBadge(a.type)}<span class="name">${esc(a.name)}</span><span class="count">${taskTotal(a)}</span>
        </div>`).join("")}
      ${g.id ? `<button class="api-link ${state.tab === "api" && state.project?.id === g.id ? "active" : ""}" data-project="${gi}">API map</button>` : ""}
    </div>`).join("");
}

function renderAppInfo() {
  const a = state.app;
  if (!a) { $("app-info").innerHTML = ""; return; }
  const also = a.also_targets.length ? `<span class="reason">also targets ${esc(a.also_targets.join(", "))}</span>` : "";
  const source = a.type_source === "engineer" ? `<span class="reason">set by you; detected as ${esc(a.detected_type)}</span>` : "";
  const evidence = a.not_detected
    ? '<div class="reason">This audit was made before app types were detected. Run <code>audit-agent start</code> on its folder again to see its apps.</div>'
    : a.evidence.length
      ? `<ul>${a.evidence.map((e) => `<li class="${e.strength}">${typeBadge(e.type)} ${esc(e.signal)}${e.strength === "supporting" ? " (supporting)" : ""}</li>`).join("")}</ul>`
      : `<div class="reason">No backend, web, or mobile signals${a.manifests.length ? ` (${esc(a.manifests.join(", "))})` : ""}.</div>`;
  $("app-info").innerHTML = `
    <h2>${esc(a.name)} ${typeBadge(a.type)} ${also} ${source}</h2>
    <div class="reason"><code>${esc(a.path)}</code></div>
    ${evidence}`;
}

async function loadGroups() {
  state.groups = await api("/api/projects");
  const hash = new URLSearchParams(location.hash.slice(1));
  const apps = state.groups.flatMap((g) => g.apps.map((a) => ({ a, g })));
  if (hash.get("tab") === "api") {
    const g = state.groups.find((x) => String(x.id) === hash.get("project"));
    if (g) return showApiMap(g);
  }
  const wanted = apps.find(({ a }) => appKey(a) === hash.get("app")) || apps[0];
  if (wanted) return selectApp(wanted.a, wanted.g);
  renderSidebar();
  await loadTasks();
}

async function selectApp(app, group) {
  state.app = app;
  state.project = group;
  state.tab = "tasks";
  state.selected.clear();
  state.openTask = null;
  $("detail").innerHTML = '<div class="empty">Select a task to see its files and connections.</div>';
  showTab();
  renderSidebar();
  renderAppInfo();
  writeHash();
  await loadTasks();
}

function showTab() {
  $("tasks-view").hidden = state.tab !== "tasks";
  $("api-view").hidden = state.tab !== "api";
  $("tab-tasks").classList.toggle("active", state.tab === "tasks");
  $("tab-api").classList.toggle("active", state.tab === "api");
  $("tab-api").disabled = !state.project?.id;
  $("where").textContent = state.project ? state.project.name : "";
}

async function loadTasks() {
  if (!state.app) { $("rows").innerHTML = '<tr><td colspan="7" class="empty">No audits yet. Run audit-agent start first.</td></tr>'; return; }
  const q = new URLSearchParams(Object.entries(filter()).filter(([, v]) => v));
  const data = await api(`/api/audits/${state.app.audit_id}/tasks?${q}`);
  state.tasks = data.tasks;
  const shown = new Set(data.tasks.map((t) => t.id));
  for (const id of [...state.selected]) if (!shown.has(id)) state.selected.delete(id);

  $("counts").innerHTML = `<span class="chip ${filter().status ? "" : "active"}" data-status="">All ${data.total}</span>` +
    STATUSES.map((s) => `<span class="chip ${filter().status === s ? "active" : ""}" data-status="${s}">${s} ${data.counts[s]}</span>`).join("");
  $("matching").textContent = `${data.tasks.length} matching`;

  const sent = sentToClaude();
  $("rows").innerHTML = data.tasks.length ? data.tasks.map((t) => {
    const runState = sent.get(t.id) || (t.in_batch ? "in_batch" : null);
    const status = runState && t.status !== "running" ? runState : t.status;
    let actions = "";
    if (t.status === "cancelled") actions = `<button class="act" data-action="restore" data-id="${t.id}">Restore</button>`;
    else if (!runState && RUNNABLE.includes(t.status)) {
      actions = `<button class="act" data-action="investigate" data-id="${t.id}">Investigate</button>
                 <button class="act" data-action="cancel" data-id="${t.id}">Cancel</button>`;
    }
    if (t.findings_without_issue) {
      actions += ` <button class="act primary" data-action="issues" data-id="${t.id}">Create GitHub issues (${t.findings_without_issue})</button>`;
    } else if (t.findings) {
      actions += ' <span class="reason">issues created</span>';
    }
    const findingsBadge = t.findings ? ` <span class="badge broken">${t.findings} finding${t.findings === 1 ? "" : "s"}</span>` : "";
    return `
    <tr class="row ${t.status} ${state.openTask === t.id ? "selected" : ""}" data-id="${t.id}">
      <td><input type="checkbox" class="pick" data-id="${t.id}" ${state.selected.has(t.id) ? "checked" : ""}></td>
      <td class="num">${t.priority}</td>
      <td><div class="title">${t.kind === "api" ? '<span class="badge api">API</span> ' : ""}${esc(t.title)}${t.test_only ? '<span class="badge test">test</span>' : ""}${findingsBadge}</div><div class="reason">${esc(t.priority_reason)}</div></td>
      <td><span class="badge ${status}">${status}</span></td>
      <td class="num">${t.file_count}</td>
      <td class="num">${t.line_count.toLocaleString()}</td>
      <td style="white-space:nowrap">${actions}</td>
    </tr>`;
  }).join("") : '<tr><td colspan="7" class="empty">No tasks match these filters.</td></tr>';
  $("send-matching").disabled = $("batch-matching").disabled =
    !data.tasks.some((t) => t.status === "pending" && !sent.has(t.id) && !t.in_batch);

  $("gaps").innerHTML = data.not_covered.length
    ? `Not covered by any task in ${esc(state.app.repo_name)}: ` + data.not_covered.map((g) => `${esc(g.what)} (${g.file_count} files)`).join(", ")
    : "Every analyzable file is covered by a task.";
  updateSelection();
}

function updateSelection() {
  $("selection").textContent = `${state.selected.size} selected`;
  $("cancel-selected").disabled = $("restore-selected").disabled = $("send-selected").disabled =
    $("batch-selected").disabled = state.selected.size === 0;
  $("select-all").checked = state.tasks.length > 0 && state.tasks.every((t) => state.selected.has(t.id));
}

async function showTask(id) {
  state.openTask = id;
  document.querySelectorAll("tr.row").forEach((r) => r.classList.toggle("selected", Number(r.dataset.id) === id));
  const d = await api(`/api/tasks/${id}`);
  const list = (rows, render, limit = 40) => rows.length
    ? `<ul>${rows.slice(0, limit).map((r) => `<li>${render(r)}</li>`).join("")}</ul>${rows.length > limit ? `<div class="reason">and ${rows.length - limit} more</div>` : ""}`
    : '<div class="reason">none</div>';
  $("detail").innerHTML = `
    <h2>${esc(d.task.title)}</h2>
    <div class="reason">${d.app ? `${typeBadge(d.app.type)} ${esc(d.app.name)} &middot; ` : ""}Task #${d.task.id} &middot; ${d.task.status} &middot; priority ${d.task.priority} (${esc(d.task.priority_reason)})</div>
    ${d.api ? apiCallSection(d.api) : ""}
    <h3>Files to audit (${d.files.length})</h3>${list(d.files, (f) => `${f.role ? `<span class="role">${esc(f.role)}</span> ` : ""}${f.repo_name && d.api ? `<span class="reason">${esc(f.repo_name)}:</span> ` : ""}<code>${esc(f.path)}</code> <span class="reason">${f.line_count ?? "?"} lines</span>`, 100)}
    ${d.api ? "" : fileTaskSections(d, list)}
    ${claudeSection(d)}`;
}

function fileTaskSections(d, list) {
  return `
    <h3>Entry points (${d.entry_points.length})</h3>${list(d.entry_points, (e) => `<code>${esc(e.path)}</code> <span class="reason">${esc(e.kind)}</span>`)}
    <h3>Imports of missing files (${d.unresolved.length})</h3>${list(d.unresolved, (u) => `<code>${esc(u.path)}:${u.line}</code> ${esc(u.specifier)}`)}
    <h3>Imports from elsewhere (${d.imports.length})</h3>${list(d.imports, (r) => `<code>${esc(r.path)}</code>`)}
    <h3>Imported by (${d.imported_by.length})</h3>${list(d.imported_by, (r) => `<code>${esc(r.path)}</code>`)}
    <h3>Packages (${d.packages.length})</h3>${list(d.packages, (p) => `${esc(p.name)} <span class="reason">${p.uses}</span>`)}
    <h3>API calls made here (${d.api_calls.length})</h3>${list(d.api_calls, (c) => {
      const where = `<code>${esc(c.method)} ${esc(c.url)}</code> <span class="reason">${esc(c.path)}:${c.line}</span>`;
      if (c.status === "matched") return `${where} &rarr; <code>${esc(c.route_app)}: ${esc(c.handler_path)}</code>`;
      if (c.status === "wrong_method") return `${where} <strong style="color:var(--danger)">wrong method</strong> <span class="reason">route is ${esc(c.route_method)} ${esc(c.route_path)}</span>`;
      return `${where} <strong style="color:var(--danger)">${esc(c.status)}</strong>`;
    })}
    <h3>API routes handled here (${d.api_routes.length})</h3>${list(d.api_routes, (r) => `<code>${esc(r.method)} ${esc(r.path)}</code> <span class="reason">${r.callers} callers</span>`)}`;
}

function apiCallSection(api) {
  const target = api.route || api.closest;
  const where = target
    ? `${api.route ? "Reaches" : api.status === "wrong_method" ? "Path exists only as" : "Closest route"}
       <code>${esc(target.method)} ${esc(target.path)}</code> in <span class="reason">${esc(target.repo)}:</span> <code>${esc(target.handler || target.file)}</code>`
    : "No backend route matches, and none is similar.";
  const problem = api.status === "broken" ? '<span class="badge broken">no route with this path</span>'
    : api.status === "wrong_method" ? '<span class="badge wrong_method">wrong method</span>' : "";
  return `<h3>The API call ${problem}</h3>
    <div>${typeBadge(api.caller_type)} ${esc(api.caller_app)} calls it from ${api.calls.length} place${api.calls.length === 1 ? "" : "s"}:</div>
    <ul>${api.calls.map((c) => `<li><code>${esc(c.file)}:${c.line}</code> <code>${esc(c.method)} ${esc(c.url)}</code>
      ${c.via ? `<span class="reason">${esc(c.via)}</span>` : ""}</li>`).join("")}</ul>
    <div style="margin-top:6px">${where}</div>`;
}

function claudeSection(d) {
  const sent = sentToClaude().get(d.task.id) || (d.in_batch ? "waiting in a batch (results within 24 hours)" : null);
  const button = !sent && RUNNABLE.includes(d.task.status)
    ? `<button class="primary act-detail" data-action="investigate" data-id="${d.task.id}">Send to Claude</button>` : "";
  const runs = d.runs.length
    ? `<ul>${d.runs.map((r) => `<li><span class="badge ${r.status}">${r.status}</span> ${esc(r.agent)} agent &middot; ${esc(r.started_at)}
        ${r.duration_ms ? ` &middot; ${Math.round(r.duration_ms / 1000)}s` : ""}${r.cost_usd != null ? ` &middot; $${r.cost_usd.toFixed(2)}` : ""}
        ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}</li>`).join("")}</ul>`
    : '<div class="reason">Not investigated yet.</div>';
  const findings = d.findings.filter((f) => f.kind === "finding");
  const review = d.findings.filter((f) => f.kind === "needs_review");
  const issueLink = (f) => f.issue_url ? ` <a href="${esc(f.issue_url)}" target="_blank" rel="noopener">GitHub issue &#8599;</a>` : "";
  const findingHtml = findings.map((f) => `<div class="finding">
      <div><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span> ${esc(f.bug_type)}: <strong>${esc(f.title)}</strong>${issueLink(f)}</div>
      <div class="meta">${f.file_audit_id && f.file_audit_id !== f.audit_id ? `${esc(f.file_repo)}: ` : ""}<code>${esc(f.file_path)}:${f.line}</code> &middot; ${esc(f.agent)} agent</div>
      ${f.evidence ? `<pre>${esc(f.evidence)}</pre>` : ""}
      <div>${esc(f.explanation)}</div></div>`).join("");
  const reviewHtml = review.map((n) => `<div class="finding review">
      <div><strong>${esc(n.title)}</strong>${issueLink(n)}</div>
      ${n.file_path ? `<div class="meta">${n.file_audit_id && n.file_audit_id !== n.audit_id ? `${esc(n.file_repo)}: ` : ""}<code>${esc(n.file_path)}:${n.line ?? ""}</code></div>` : ""}
      <div>${esc(n.explanation)}</div>
      <div class="meta">Not confirmed because: ${esc(n.why_unconfirmed || "not stated")}</div></div>`).join("");
  return `
    <h3>Claude ${button}</h3>
    ${sent ? `<div class="reason">Sent to Claude: ${esc(sent)}</div>` : ""}
    ${runs}
    ${d.findings.some((f) => !f.issue_url)
      ? `<div style="margin-top:12px"><button class="issues-btn" data-id="${d.task.id}">Create GitHub issues (${d.findings.filter((f) => !f.issue_url).length})</button>
         <span class="reason">for this task's findings and items to review</span></div>` : ""}
    <h3>Findings (${findings.length})</h3>${findingHtml || '<div class="reason">none</div>'}
    <h3>Needs your review (${review.length}), not counted as bugs</h3>${reviewHtml || '<div class="reason">none</div>'}`;
}

// Sending tasks to Claude

function sentToClaude() {
  const sent = new Map();
  const r = state.run;
  if (!r) return sent;
  r.queued.forEach((t) => sent.set(t.id, "queued"));
  r.waiting.forEach((t) => sent.set(t.id, "waiting"));
  r.running.forEach((t) => sent.set(t.id, "running"));
  return sent;
}

function renderRun() {
  const r = state.run;
  if (!r) return;
  if (document.activeElement !== $("parallel")) $("parallel").value = r.parallel;
  const parts = [];
  if (r.running.length) parts.push(`${r.running.length} running`);
  if (r.queued.length) parts.push(`${r.queued.length} queued`);
  if (r.waiting.length) parts.push(`${r.waiting.length} waiting on a rate limit`);
  const done = r.finished.filter((f) => f.status === "done").length;
  const failed = r.finished.length - done;
  if (r.finished.length) parts.push(`${done} finished${failed ? `, ${failed} failed` : ""} this session`);
  $("run-summary").innerHTML = `<span class="reason">${esc(r.runner)}${parts.length ? " &middot; " + esc(parts.join(", ")) : ""}</span>`;
  $("run-stop").hidden = !(r.queued.length || r.waiting.length);
  const item = (t, badge, extra = "") => `<div class="item" data-id="${t.id}"><span class="badge ${badge}">${badge}</span>
    <span class="t">#${t.id} ${esc(t.title)}</span>${extra}</div>`;
  const finished = r.finished.slice(0, 5).map((f) => item(f, f.status === "done" ? "done" : "failed",
    f.status === "done"
      ? `<span class="reason">${f.findings ?? 0} findings, ${f.needs_review ?? 0} to review${f.cost_usd != null ? `, $${f.cost_usd.toFixed(2)}` : ""}</span>`
      : `<span class="err">${esc((f.error || "").slice(0, 160))}</span>`));
  $("run-detail").innerHTML = [
    ...r.running.map((t) => item(t, "running")),
    ...r.waiting.map((t) => item(t, "waiting", `<span class="reason">${esc(t.reason)}</span>`)),
    ...(r.queued.length ? [`<div class="reason">${r.queued.length} queued: ${r.queued.slice(0, 6).map((t) => `#${t.id}`).join(", ")}${r.queued.length > 6 ? "…" : ""}</div>`] : []),
    ...finished,
  ].join("");
}

async function pollRun() {
  clearTimeout(pollRun.timer);
  const before = state.run;
  state.run = await api("/api/run");
  renderRun();
  const changed = !before || before.finished.length !== state.run.finished.length
    || before.running.length !== state.run.running.length || before.active !== state.run.active;
  if (changed && before) {
    await loadTasks();
    state.groups = await api("/api/projects");
    renderSidebar();
    if (state.openTask) await showTask(state.openTask);
  }
  if (state.run.active) pollRun.timer = setTimeout(() => pollRun().catch(() => {}), 2000);
}

// Batches

function renderBatches(b) {
  state.batches = b;
  const open = b.batches.filter((x) => ["submitting", "in_progress", "canceling", "ended"].includes(x.status));
  const waiting = open.reduce((n, x) => n + x.waiting, 0);
  $("batch-summary").textContent = !b.available
    ? "needs an Anthropic API key (audit-agent set-api-key)"
    : open.length ? `${open.length} open, ${waiting} task${waiting === 1 ? "" : "s"} waiting${b.last_checked ? `, checked ${b.last_checked.slice(11, 16)} UTC` : ""}`
      : b.batches.length ? "no open batches" : "";
  $("batch-selected").title = $("batch-matching").title = b.available ? "" : "Batches need an Anthropic API key";
  const row = (x) => `<div class="item" style="cursor:default"><span class="badge ${x.status}">${x.status.replace("_", " ")}</span>
    <span class="t">#${x.id} ${esc(x.anthropic_id || "not confirmed yet")}${x.round > 1 ? ` &middot; round ${x.round}` : ""} &middot; ${x.request_count} task${x.request_count === 1 ? "" : "s"}
      ${x.continued ? `&middot; ${x.continued} went on to round ${(x.round || 1) + 1} with more files` : ""}
      ${x.waiting ? `&middot; ${x.waiting} waiting` : ""} ${x.succeeded ? `&middot; ${x.succeeded} answered` : ""}
      ${x.errored ? `&middot; ${x.errored} errored` : ""} ${x.expired ? `&middot; ${x.expired} expired` : ""}
      ${x.recovered ? "&middot; recovered" : ""}</span>
    ${x.error ? `<span class="err">${esc(x.error)}</span>` : ""}
    ${x.status === "in_progress" ? `<button class="batch-cancel" data-id="${x.id}">Cancel</button>` : ""}</div>`;
  $("batch-detail").innerHTML = [
    ...(b.last_error ? [`<div class="err">Last check failed: ${esc(b.last_error)}</div>`] : []),
    ...b.batches.slice(0, 6).map(row),
  ].join("");
}

async function pollBatches() {
  clearTimeout(pollBatches.timer);
  const before = state.batches;
  const b = await api("/api/batches");
  renderBatches(b);
  const signature = (x) => x ? x.batches.map((y) => `${y.id}:${y.status}:${y.waiting}`).join(",") : "";
  if (before && signature(before) !== signature(b)) {
    await loadTasks();
    state.groups = await api("/api/projects");
    renderSidebar();
    if (state.openTask) await showTask(state.openTask);
  }
  const open = b.batches.some((x) => ["submitting", "in_progress", "canceling", "ended"].includes(x.status));
  if (open) pollBatches.timer = setTimeout(() => pollBatches().catch(() => {}), 30000);
}

async function sendBatch(body, count) {
  if (state.batches && !state.batches.available) return toast("Batches need an Anthropic API key: run audit-agent set-api-key", true);
  if (!confirm(`Send ${count} task${count === 1 ? "" : "s"} to Claude as a batch?\n\n` +
      "Half the price of sending them live. Results arrive within 24 hours, usually much sooner. " +
      "Each task goes in as one request with its files' code included, and is checked like a live run. " +
      "You can close the app; results are collected the next time it runs.")) return;
  const res = await api("/api/batches", body);
  const skipped = res.result.skipped.length
    ? ` (${res.result.skipped.length} skipped: ${[...new Set(res.result.skipped.map((s) => s.reason))].join("; ")})` : "";
  toast(`Sent ${res.result.queued.length} task${res.result.queued.length === 1 ? "" : "s"} as a batch${skipped}`);
  state.selected.clear();
  renderBatches(res);
  await loadTasks();
  pollBatches().catch(() => {});
}

async function sendToClaude(body, count) {
  const parallel = Number($("parallel").value) || 1;
  const runner = state.run ? state.run.runner : "Claude";
  if (!confirm(`Send ${count} task${count === 1 ? "" : "s"} to Claude?\n\n` +
      `Each task is a separate read-only investigation using ${runner}, ${parallel} at a time. ` +
      `Each one uses your Claude usage.`)) return;
  const res = await api("/api/run", { ...body, parallel });
  const skipped = res.skipped.length ? ` (${res.skipped.length} skipped: ${[...new Set(res.skipped.map((s) => s.reason))].join(", ")})` : "";
  toast(`Sent ${res.queued.length} task${res.queued.length === 1 ? "" : "s"} to Claude${skipped}`);
  state.selected.clear();
  state.run = res.status;
  renderRun();
  await loadTasks();
  if (state.openTask) await showTask(state.openTask);
  pollRun().catch(() => {});
}

async function change(action, ids) {
  const res = await api(`/api/tasks/${action}`, { ids });
  toast(`${action === "cancel" ? "Cancelled" : "Restored"} ${res.changed} task${res.changed === 1 ? "" : "s"}`);
  await refresh();
}

async function changeMatching(action) {
  const count = state.tasks.length;
  if (!count) return;
  const verb = action === "cancel" ? "Cancel" : "Restore";
  if (!confirm(`${verb} all ${count} tasks matching the current filters in ${state.app.name}?`)) return;
  const res = await api(`/api/audits/${state.app.audit_id}/${action}`, { filter: filter() });
  toast(`${verb}${action === "cancel" ? "led" : "d"} ${res.changed} task${res.changed === 1 ? "" : "s"}`);
  await refresh();
}

async function refresh() {
  await loadTasks();
  state.groups = await api("/api/projects");
  renderSidebar();
  if (state.openTask) await showTask(state.openTask);
}

// API map

async function showApiMap(group) {
  state.project = group;
  state.tab = "api";
  showTab();
  renderSidebar();
  writeHash();
  $("api-view").innerHTML = '<div class="empty">Loading the API map…</div>';
  state.apiMap = await api(`/api/projects/${group.id}/api-map`);
  renderApiMap();
}

function table(headers, rows, empty) {
  if (!rows.length) return `<div class="reason">${empty}</div>`;
  return `<table><thead><tr>${headers.map((h) => `<th class="${h.endsWith("#") ? "num" : ""}">${esc(h.replace(/#$/, ""))}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("")}</tbody></table>`;
}

function callersCell(callers) {
  if (!callers.length) return '<span class="reason">none</span>';
  const line = (c) => `<div><span class="reason">${esc(c.app)}:</span> <code>${esc(c.path)}:${c.line}</code></div>`;
  const first = callers.slice(0, 3).map(line).join("");
  const rest = callers.slice(3);
  return first + (rest.length ? `<details><summary>${rest.length} more</summary>${rest.map(line).join("")}</details>` : "");
}

function routeRows(search) {
  const needle = search.toLowerCase();
  return state.apiMap.routes
    .filter((r) => !needle || [r.method, r.path, r.handler_path, r.file_path, ...r.callers.map((c) => c.path)]
      .some((v) => String(v ?? "").toLowerCase().includes(needle)))
    .map((r) => `<tr>
      <td><code>${esc(r.method)}</code></td>
      <td><code>${esc(r.path)}</code></td>
      <td><span class="reason">${esc(r.app.name)}:</span> <code>${esc(r.handler_path || r.file_path)}</code></td>
      <td class="num">${r.callers.length}</td>
      <td>${callersCell(r.callers)}</td>
    </tr>`);
}

function renderApiMap() {
  const m = state.apiMap;
  const labels = { matched: "matched", wrong_method: "wrong method", broken: "no route", unresolved: "built at runtime", external: "other services" };
  const chips = Object.entries(m.counts).map(([s, n]) => `<span class="chip">${labels[s] || s} ${n}</span>`).join("");
  const links = m.links.length
    ? `<div class="links">${m.links.map((l) => `<div class="link-card">
        <div>${typeBadge(l.from_type)} ${TYPE_LABELS[l.from_type]} to ${typeBadge(l.to_type)} ${TYPE_LABELS[l.to_type]}</div>
        <div class="n">${l.calls}</div>
        <div class="reason">${esc(l.from)} &rarr; ${esc(l.to)}</div></div>`).join("")}</div>`
    : '<div class="reason">No calls matched a route yet.</div>';
  const problems = table(["App", "Where", "Call", "Problem", "Closest route"], m.problems.map((p) => `<tr>
      <td>${typeBadge(p.app_type)} ${esc(p.app)}</td>
      <td><code>${esc(p.path)}:${p.line}</code></td>
      <td><code>${esc(p.method)} ${esc(p.url)}</code></td>
      <td><span class="badge ${p.status}">${p.status === "broken" ? "no route with this path" : "wrong method"}</span></td>
      <td>${p.closest ? `<code>${esc(p.closest.method)} ${esc(p.closest.path)}</code>` : '<span class="reason">none close</span>'}</td>
    </tr>`), "Every matched call reaches a route.");
  const mentioned = table(["Route", "Mentioned in", "Text"], m.mentioned.map((x) => `<tr>
      <td><code>${esc(x.method)} ${esc(x.path)}</code></td>
      <td><span class="reason">${esc(x.app)}:</span> <code>${esc(x.file)}:${x.line}</code></td>
      <td><code>${esc(x.text)}</code></td></tr>`), "None.");
  const unused = table(["Method", "Path", "Handler"], m.unused.map((r) => `<tr>
      <td><code>${esc(r.method)}</code></td><td><code>${esc(r.path)}</code></td>
      <td><span class="reason">${esc(r.app.name)}:</span> <code>${esc(r.handler_path || r.file_path)}</code></td></tr>`), "None.");
  $("api-view").innerHTML = `
    <h2>${esc(m.project.name)}: API map</h2>
    <div class="reason">Built ${esc(m.project.api_mapped_at || "not yet; run audit-agent map-api")}</div>
    <div class="counts" style="padding-left:0">${chips}</div>
    <section><h3>App links</h3>${links}</section>
    <section><h3>Calls that don't reach a route (${m.problems.length})</h3>${problems}</section>
    <section><h3>Backend routes (${m.routes.length}) <input id="route-search" type="text" placeholder="Search paths, handlers, callers"></h3>
      <div id="route-table">${table(["Method", "Path", "Handler", "Callers#", "Called from"], routeRows(""), "No routes found.")}</div></section>
    <section><h3>Only mentioned in frontend code (${new Set(m.mentioned.map((x) => x.method + x.path)).size} routes)</h3>${mentioned}</section>
    <section><h3>Not referenced anywhere (${m.unused.length})</h3>${unused}</section>`;
  let typingRoutes;
  $("route-search").addEventListener("input", (e) => {
    clearTimeout(typingRoutes);
    typingRoutes = setTimeout(() => {
      $("route-table").innerHTML = table(["Method", "Path", "Handler", "Callers#", "Called from"], routeRows(e.target.value.trim()), "No routes match.");
    }, 150);
  });
}

// Events

$("sidebar").addEventListener("click", (e) => {
  const app = e.target.closest(".app");
  if (app) {
    const group = state.groups[Number(app.dataset.group)];
    return selectApp(group.apps.find((a) => appKey(a) === app.dataset.key), group);
  }
  const link = e.target.closest(".api-link");
  if (link) showApiMap(state.groups[Number(link.dataset.project)]);
});
$("tab-tasks").addEventListener("click", () => {
  const app = state.app && state.project?.apps.some((a) => appKey(a) === appKey(state.app)) ? state.app : state.project?.apps[0];
  if (app) selectApp(app, state.project);
});
$("tab-api").addEventListener("click", () => { if (state.project?.id) showApiMap(state.project); });
let typing;
for (const id of ["folder", "search"]) $(id).addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(loadTasks, 200); });
for (const id of ["status", "tests", "kind"]) $(id).addEventListener("change", loadTasks);
$("status").innerHTML += STATUSES.map((s) => `<option value="${s}">${s}</option>`).join("");
$("counts").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  $("status").value = chip.dataset.status;
  loadTasks();
});
$("rows").addEventListener("click", (e) => {
  const pick = e.target.closest(".pick");
  if (pick) {
    const id = Number(pick.dataset.id);
    pick.checked ? state.selected.add(id) : state.selected.delete(id);
    return updateSelection();
  }
  const act = e.target.closest(".act");
  if (act && act.dataset.action === "investigate") return sendToClaude({ ids: [Number(act.dataset.id)] }, 1);
  if (act && act.dataset.action === "issues") return createIssues(Number(act.dataset.id), act);
  if (act) return change(act.dataset.action, [Number(act.dataset.id)]);
  const row = e.target.closest("tr.row");
  if (row) showTask(Number(row.dataset.id));
});
$("detail").addEventListener("click", (e) => {
  const act = e.target.closest(".act-detail");
  if (act) sendToClaude({ ids: [Number(act.dataset.id)] }, 1);
  const issues = e.target.closest(".issues-btn");
  if (issues) createIssues(Number(issues.dataset.id), issues);
});

async function createIssues(taskId, button) {
  const plan = await api(`/api/tasks/${taskId}/issues`);
  const todo = plan.issues.filter((i) => !i.issue_url && !i.problem);
  const blocked = plan.issues.filter((i) => !i.issue_url && i.problem);
  if (!todo.length) return toast(blocked.length ? `Can't create issues: ${blocked[0].problem}` : "Every finding already has an issue", true);
  const lines = todo.map((i) => `• ${i.title}\n   → ${i.repo}  [${i.labels.join(", ")}]`).join("\n");
  if (!confirm(`Create ${todo.length} GitHub issue${todo.length === 1 ? "" : "s"}?\n\n${lines}\n\n` +
      `They'll be added to your public project board "${plan.board}" (created if it doesn't exist). ` +
      `People see them only if they have access to the repositories.` +
      (blocked.length ? `\n\nSkipped: ${blocked.map((i) => i.problem).join("; ")}` : ""))) return;
  button.disabled = true;
  button.textContent = "Creating issues…";
  try {
    const res = await api(`/api/tasks/${taskId}/issues`, { finding_ids: todo.map((i) => i.finding_id) });
    toast(`Created ${res.created.length} issue${res.created.length === 1 ? "" : "s"}` +
          (res.board ? ` on "${res.board.title}"` : "") + (res.warnings.length ? ` (${res.warnings.length} warning)` : ""),
          res.warnings.length > 0);
  } finally {
    await loadTasks();
    await showTask(taskId);
  }
}
$("run-detail").addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (item) showTask(Number(item.dataset.id));
});
$("send-selected").addEventListener("click", () => {
  const ids = [...state.selected];
  if (ids.length) sendToClaude({ ids }, ids.length);
});
$("send-matching").addEventListener("click", () => {
  const sent = sentToClaude();
  const count = state.tasks.filter((t) => t.status === "pending" && !sent.has(t.id)).length;
  if (count) sendToClaude({ audit_id: state.app.audit_id, filter: filter() }, count);
});
$("parallel").addEventListener("change", async () => {
  const parallel = Number($("parallel").value);
  if (!(parallel >= 1 && parallel <= 8)) return toast("Choose between 1 and 8 at a time");
  state.run = (await api("/api/run", { ids: [], parallel })).status;
  renderRun();
});
$("batch-selected").addEventListener("click", () => {
  const ids = [...state.selected];
  if (ids.length) sendBatch({ ids }, ids.length);
});
$("batch-matching").addEventListener("click", () => {
  const sent = sentToClaude();
  const count = state.tasks.filter((t) => t.status === "pending" && !sent.has(t.id) && !t.in_batch).length;
  if (count) sendBatch({ audit_id: state.app.audit_id, filter: filter() }, count);
});
$("batch-check").addEventListener("click", async () => {
  const res = await api("/api/batches/check", {});
  renderBatches(res);
  toast(`Checked ${res.result.checked} batch${res.result.checked === 1 ? "" : "es"}: ${res.result.imported} imported`);
  await loadTasks();
  pollBatches().catch(() => {});
});
$("batch-recover").addEventListener("click", async () => {
  const res = await api("/api/batches/recover", {});
  renderBatches(res);
  const r = res.result;
  toast(`Recovered ${r.matched + r.adopted} batch${r.matched + r.adopted === 1 ? "" : "es"}` +
        (r.unrecognized_in_progress ? `; ${r.unrecognized_in_progress} still running elsewhere on the account` : ""));
  await loadTasks();
});
$("batch-detail").addEventListener("click", async (e) => {
  const button = e.target.closest(".batch-cancel");
  if (!button || !confirm("Cancel this batch? Requests that already finished are still imported.")) return;
  renderBatches(await api(`/api/batches/${button.dataset.id}/cancel`, {}));
  pollBatches().catch(() => {});
});
$("run-stop").addEventListener("click", async () => {
  if (!confirm("Drop the queued tasks? Investigations already running will finish.")) return;
  const res = await api("/api/run/stop", {});
  toast(`Dropped ${res.dropped} queued task${res.dropped === 1 ? "" : "s"}`);
  state.run = res.status;
  renderRun();
  await loadTasks();
});
$("select-all").addEventListener("change", (e) => {
  state.tasks.forEach((t) => e.target.checked ? state.selected.add(t.id) : state.selected.delete(t.id));
  loadTasks();
});
$("cancel-selected").addEventListener("click", () => change("cancel", [...state.selected]));
$("restore-selected").addEventListener("click", () => change("restore", [...state.selected]));
$("cancel-matching").addEventListener("click", () => changeMatching("cancel"));
$("restore-matching").addEventListener("click", () => changeMatching("restore"));

pollBatches().catch(() => {});
pollRun()
  .catch((err) => {
    $("run-summary").innerHTML = `<span class="err">${esc(err.message)}</span>`;
    $("send-selected").disabled = $("send-matching").disabled = true;
  })
  .then(loadGroups)
  .catch((err) => { $("rows").innerHTML = `<tr><td colspan="7" class="empty">${esc(err.message)}</td></tr>`; });
</script>
</body>
</html>
